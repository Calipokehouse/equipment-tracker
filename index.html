/* ---------- Excel backup: one workbook, five sheets ---------- */
function backupSheets(){
  const stamp = new Date().toLocaleString();
  const inv = [['Asset ID','Name','Category','Qty','Site','Status','Room / holder','Team','Home','Condition','Serial','Notes','Not returned','Last moved','Last moved by']];
  items().sort((a,b)=>a.id.localeCompare(b.id)).forEach(i=>{
    const e = itemEvents(i.id)[0];
    inv.push([i.id, i.name, catLabel(i.category), i.qty||1, siteName(i.site), STATUSES[i.status],
      holderText(i), itemTeam(i)||'', i.home||'', i.condition||'', i.serial||'', i.notes||'',
      (i.status==='with_employee'&&isFormer(i.holderId))?'YES':'',
      e? new Date(e.ts).toLocaleString():'', e? e.actor:'']);
  });

  const log = [['Timestamp','Site','Asset ID','Asset','What happened','Logged by','Note']];
  Object.values(State.events).sort((a,b)=>a.ts-b.ts).forEach(e=>
    log.push([new Date(e.ts).toLocaleString(), siteShort(e.site||''), e.assetId||'', e.assetName||'', e.text||'', e.actor||'', e.note||'']));

  const ppl = [['Name','Site','Team','Leads','Status','Items checked out','Item IDs']];
  peopleList().forEach(p=>{
    const mine = items().filter(i=>i.status==='with_employee' && i.holderId===p.id);
    ppl.push([p.name, siteName(p.site||'A2'), p.team||'', leadsOf(p.id).join(', '),
      p.active===false?'Former':'Current', mine.length, mine.map(i=>i.id).join(', ')]);
  });

  const tms = [['Team','Site','Accountable lead','Shared items','Members','Items held by members']];
  (State.teams||[]).forEach(t=>{
    const mem = teamMembers(t.name);
    const held = items().filter(i=>i.status==='with_employee' && mem.some(m=>m.id===i.holderId)).length;
    tms.push([t.name, siteName(t.site), teamLead(t.name)||'(none set)', teamOwned(t.name).length, mem.length, held]);
  });

  const rms = [['Location','Site','Type','Items assigned','Away from this room']];
  (State.locations||[]).forEach(l=>{
    const here = items().filter(i=>i.status==='in_room' && i.room===l.name).length;
    const away = items().filter(i=>i.home===l.name && i.status!=='in_room' && i.status!=='retired').length;
    rms.push([l.name, siteName(l.site), l.room?'Stream room':'Storage area', here, away]);
  });

  const info = [['CaliPokeHouse asset backup'],['Generated', stamp],['Generated by', State.actor||'Unknown'],
    [''],['Total items', items().length],['Items with people', items().filter(i=>i.status==='with_employee').length],
    ['Never returned', owedItems().length],['People', peopleList().length],['Teams', (State.teams||[]).length],
    ['Movement events', Object.keys(State.events).length]];

  return {info, inv, log, ppl, tms, rms, stamp};
}

function exportWorkbook(){
  if(typeof XLSX==='undefined') return toast('Excel library did not load \u2014 check your connection');
  const d = backupSheets();
  const wb = XLSX.utils.book_new();
  const add = (rows,name,widths)=>{
    const ws = XLSX.utils.aoa_to_sheet(rows);
    if(widths) ws['!cols'] = widths.map(w=>({wch:w}));
    if(rows.length>1) ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:rows[0].length-1}})};
    ws['!freeze'] = {xSplit:0, ySplit:1};
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  add(d.info,'Summary',[26,26]);
  add(d.inv,'Inventory',[14,32,18,6,22,16,26,20,20,11,18,30,12,20,16]);
  add(d.ppl,'People',[24,22,20,20,10,10,34]);
  add(d.tms,'Teams',[24,22,20,13,10,20]);
  add(d.rms,'Locations',[24,22,14,14,18]);
  add(d.log,'Movement log',[20,10,14,30,46,18,28]);
  const name = 'cph-assets-backup-'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, name);
  toast('Workbook downloaded');
}

/* Split an item name into at most two display lines.
   Prefers a dash as the break point, otherwise breaks at a word boundary.
   Never breaks mid-word. */
function nameLines(text){
  const t = String(text||'').trim();
  const m = t.match(/^(.*?)\s*([\u2014\u2013-]\s.*)$/);
  if(m && m[1].trim()) return [m[1].trim(), m[2].trim()];
  const w = t.split(/\s+/);
  if(w.length < 4) return [t];
  const half = Math.ceil(w.length/2);
  return [w.slice(0,half).join(' '), w.slice(half).join(' ')];
}

/* Swaps the printed page size and turns the label 90 degrees.
   Some thermal drivers define 2.25x1.25 media as portrait; this matches them. */

}

function labelSheet(ids){
  /* Selection state lives on State so re-renders inside the sheet keep it. */
  const pool = items().filter(i=>i.status!=='retired' && i.site===State.fSite)
                      .sort((a,b)=>a.id.localeCompare(b.id));
  if(ids){ State.lblSel = {}; ids.forEach(k=>State.lblSel[k]=true); State.lblFilter='all'; State.lblWho=''; }
  if(!State.lblSel) State.lblSel = {};
  if(State.lblFilter===undefined) State.lblFilter = 'unprinted';
  if(State.lblWho===undefined) State.lblWho = '';

  /* who/where options, built from what actually exists */
  const whoOpts = (()=>{
    const out = [];
    const ppl = {}, rooms = {}, teams = {}, homes = {};
    pool.forEach(i=>{
      if(i.status==='with_employee' && i.holderName) ppl['p:'+i.holderId] = i.holderName;
      if(i.status==='in_room' && i.room) rooms['r:'+i.room] = i.room;
      if(i.status==='with_team' && i.team) teams['t:'+i.team] = i.team;
      if(i.home) homes['h:'+i.home] = i.home;
    });
    const grp = (label, obj)=>{
      const keys = Object.keys(obj).sort((a,b)=>obj[a].localeCompare(obj[b]));
      return keys.length ? '<optgroup label="'+esc(label)+'">'+
        keys.map(k=>'<option value="'+esc(k)+'" '+(State.lblWho===k?'selected':'')+'>'+esc(obj[k])+'</option>').join('')+

    };
    out.push('<option value="" '+(State.lblWho?'':'selected')+'>Everything at '+esc(siteShort(State.fSite))+'</option>');
    out.push(grp('Checked out to', ppl));
    out.push(grp('Stream room', rooms));
    out.push(grp('Team', teams));
    out.push(grp('Home location', homes));
    return out.join('');
  })();

  const matchWho = i =>{
    if(!State.lblWho) return true;
    const [k,v] = [State.lblWho.slice(0,2), State.lblWho.slice(2)];
    if(k==='p:') return i.holderId===v;
    if(k==='r:') return i.room===v;
    if(k==='t:') return i.team===v && i.status==='with_team';
    if(k==='h:') return i.home===v;
    return true;
  };
  const matchFilter = i =>
    State.lblFilter==='unprinted' ? !i.printedAt :
    State.lblFilter==='printed'   ? !!i.printedAt : true;

  const shown = pool.filter(i=>matchWho(i) && matchFilter(i));

    '<div class="label"><div class="labelinner flag">'+half(i)+half(i)+'<div class="fold"></div></div></div>';
  const tagStd = i =>
    '<div class="label"><div class="labelinner"><div class="qr">'+qrSvg(i.id)+'</div><div class="txt">'+
      '<div class="lid">'+esc(i.id)+'</div>'+
      '<div class="lnm">'+nameLines(i.name).map(l=>'<div>'+esc(l)+'</div>').join('')+'</div>'+
      '<div class="lrule"></div>'+
      ((i.room || i.home) ? '<div class="lloc">'+esc(i.room || i.home)+'</div>' : '')+
      '<div class="lsite">'+esc(siteName(i.site))+'</div>'+
    '</div></div></div>';
  const tag = i => labelFormat()==='flag' ? tagFlag(i) : tagStd(i);

  const pickRow = i =>
    '<label class="chk pick'+(State.lblSel[i.id]?' done':'')+'" style="padding:9px 11px">'+
      '<input type="checkbox" data-pick="'+esc(i.id)+'"'+(State.lblSel[i.id]?' checked':'')+'>'+
      '<div class="main">'+
        '<div class="nm" style="font-size:14px">'+esc(i.name)+'</div>'+
        '<div class="meta">'+chip(i.id,'ghost')+' '+esc(holderText(i)||siteShort(i.site))+
          (i.printedAt? ' <span class="donetag">printed</span>':'')+'</div>'+
      '</div>'+
    '</label>';

  openSheet('Labels',
    '<div class="chiprow noprint" style="margin-bottom:8px">'+
      ['unprinted','all','printed'].map(f=>'<button class="chip" data-lblfilter="'+f+'" aria-pressed="'+(State.lblFilter===f)+'">'+
        (f==='unprinted'?'Not printed yet':f==='all'?'All':'Already printed')+'</button>').join('')+
    '</div>'+
    '<div class="f noprint"><label>Who or where</label><select id="lblWho">'+whoOpts+'</select></div>'+

    '<div class="btnrow noprint" style="margin-bottom:8px">'+
      '<button class="btn sm" id="selAll">Select all '+shown.length+'</button>'+
      '<button class="btn sm" id="selNone">Clear</button>'+
    '</div>'+

    '<div class="noprint" style="max-height:44vh;overflow:auto;margin-bottom:12px">'+
      (shown.length? shown.map(pickRow).join('')
        : '<div class="empty"><b>Nothing here</b>'+
          (State.lblFilter==='unprinted'? 'Everything matching has already been printed.' : 'Try a different filter.')+'</div>')+
    '</div>'+

    '<div class="chiprow noprint" style="margin-bottom:6px">'+
      '<button class="chip" data-lblfmt="standard" aria-pressed="'+(labelFormat()==='standard')+'">Standard</button>'+
      '<button class="chip" data-lblfmt="flag" aria-pressed="'+(labelFormat()==='flag')+'">Cable flag</button>'+
      '<button class="chip" id="rotBtn">'+(LS.get('cph_rotlbl')==='1'?'\u21BA Rotated':'\u21BB Rotate 90\u00B0')+'</button>'+
    '</div>'+
    '<div class="noprint" style="font-size:12.5px;color:var(--muted);margin-bottom:12px">'+
      (labelFormat()==='flag'
        ? 'Fold down the dashed middle line around the cable so both sides read.'
        : 'Paper 2.25\u00D7\u200B1.25in, margins none, scale 100%, headers off.')+
    '</div>'+

    '<div class="btnrow noprint" style="margin-bottom:6px">'+
      '<button class="btn pri" id="doPrint"'+(chosen.length?'':' disabled')+'>Print '+chosen.length+' label'+(chosen.length===1?'':'s')+'</button>'+
      (chosen.length? '<button class="btn sm" id="markPrinted">Mark as printed</button>' : '')+
    '</div>'+
    (chosen.length? '<div class="noprint" style="font-size:12.5px;color:var(--faint);margin-bottom:10px">Printing marks these as printed so they drop out of the list next time.</div>':'')+

    '<div class="labelgrid">'+chosen.map(tag).join('')+'</div>',
  body=>{
    const refresh = ()=>labelSheet(null);

    body.querySelectorAll('[data-lblfilter]').forEach(b=> b.onclick = ()=>{
      State.lblFilter = b.dataset.lblfilter; refresh(); });

    const whoSel = body.querySelector('#lblWho');
    if(whoSel) whoSel.onchange = ()=>{ State.lblWho = whoSel.value; refresh(); };

    body.querySelectorAll('[data-pick]').forEach(cb=> cb.onchange = ()=>{
      if(cb.checked) State.lblSel[cb.dataset.pick] = true;
      else delete State.lblSel[cb.dataset.pick];
      refresh();
    });

    body.querySelector('#selAll').onclick = ()=>{ shown.forEach(i=>State.lblSel[i.id]=true); refresh(); };
    body.querySelector('#selNone').onclick = ()=>{ State.lblSel = {}; refresh(); };

    body.querySelectorAll('[data-lblfmt]').forEach(b=> b.onclick = ()=>{
      LS.set('cph_lblfmt', b.dataset.lblfmt); refresh(); });

    body.querySelector('#rotBtn').onclick = ()=>{
      LS.set('cph_rotlbl', LS.get('cph_rotlbl')==='1' ? '0' : '1');
      applyLabelRotation(); refresh();
    };

    const stamp = ()=>{
      chosen.forEach(i=>{
        const upd = Object.assign({}, State.items[i.id], {printedAt: Date.now()});
        State.items[i.id] = upd;
        put('items', i.id, upd);
      });
    };

    const dp = body.querySelector('#doPrint');
    if(dp) dp.onclick = ()=>{ window.print(); setTimeout(()=>{ stamp(); refresh(); }, 800); };

    const mp = body.querySelector('#markPrinted');
    if(mp) mp.onclick = ()=>{ stamp(); toast('Marked '+chosen.length+' as printed'); refresh(); };
  });
}

/* ============================================================
   RENDER + WIRING
   ============================================================ */
function setNav(){
  document.querySelectorAll('.nav button').forEach(x=>x.setAttribute('aria-current', x.dataset.tab===State.tab?'true':'false'));
}
function render(){
  const app = document.getElementById('app');
  const v = {find:viewFind, scan:viewScan, rooms:viewRooms, people:viewPeople, log:viewLog}[State.tab];
  app.innerHTML = v();
  document.getElementById('whoName').textContent = State.actor || (State.online ? 'Sign in' : 'Set name');
  document.getElementById('syncDot').className = 'dot' + (State.online?'':' off');
  wire();
}

function wire(){
  const app = document.getElementById('app');
  const el2 = id => app.querySelector('#'+id);

  app.querySelectorAll('[data-item]').forEach(b=> b.onclick = ()=>openItem(b.dataset.item));
  app.querySelectorAll('[data-group]').forEach(b=> b.onclick = ()=>{
    const k = b.dataset.group;
    State.openGroups[k] = !State.openGroups[k];
    render();
  });
  app.querySelectorAll('[data-person]').forEach(b=> b.onclick = ()=>openPerson(b.dataset.person));
  app.querySelectorAll('[data-room]').forEach(b=> b.onclick = ()=>openRoom(b.dataset.room));
  app.querySelectorAll('[data-team-open]').forEach(b=> b.onclick = ()=>openTeam(b.dataset.teamOpen));
  app.querySelectorAll('[data-team-filter]').forEach(b=> b.onclick = ()=>{ State.fTeam = b.dataset.teamFilter; render(); });
  app.querySelectorAll('[data-site]').forEach(b=> b.onclick = ()=>{
    State.fSite = b.dataset.site; LS.set('cph_site', State.fSite); render(); });

  const q = el2('q');
  if(q){
    q.oninput = ()=>{
      State.q = q.value;
      const start = q.selectionStart;
      render();
      const nq = document.getElementById('q');
      nq.focus(); nq.setSelectionRange(start,start);
    };
  }
  if(el2('qclear')) el2('qclear').onclick = ()=>{ State.q=''; render(); };

  app.querySelectorAll('[data-cat]').forEach(b=> b.onclick = ()=>{
    State.fCat = (State.fCat===b.dataset.cat)?'':b.dataset.cat; render(); });
  app.querySelectorAll('[data-status]').forEach(b=> b.onclick = ()=>{ State.fStatus = b.dataset.status; render(); });

  if(el2('addItem')) el2('addItem').onclick = ()=>itemForm(null);
  if(el2('printLabels')) el2('printLabels').onclick = ()=>labelSheet(null);
  if(el2('addRoomBtn')) el2('addRoomBtn').onclick = ()=>addLocForm();
  if(el2('addTeamBtn')) el2('addTeamBtn').onclick = ()=>addTeamForm();
  if(el2('addPerson')) el2('addPerson').onclick = ()=>personForm(null);
  if(el2('seedRoster')) el2('seedRoster').onclick = ()=>seedRoster();

  if(State.tab==='scan') wireScan();

  if(el2('expXlsx')) el2('expXlsx').onclick = ()=>exportWorkbook();

}

document.querySelectorAll('.nav button').forEach(b=>{
  b.onclick = ()=>{ stopScanner(); State.tab = b.dataset.tab; setNav(); window.scrollTo(0,0); render(); };
});
document.getElementById('setupBtn').onclick = openSetup;
function whoAmISheet(){
  if(!State.online){
    openSheet('Not connected',
      '<div class="banner"><b>Cannot reach the team database</b>This device is running on its own private copy. Check the connection and reload \u2014 no setup should be needed.</div>'+
      '<div class="f"><label>Your name (used on the log while testing)</label><input id="tn" value="'+esc(State.actor||'')+'" placeholder="First and last name"></div>'+
      '<button class="btn pri full" id="tgo">Save</button>',
    b=>{ b.querySelector('#tgo').onclick = ()=>{
      const n=b.querySelector('#tn').value.trim();
      if(n){ State.actor=n; LS.set('cph_actor',n); toast('Set to '+n); }
      closeSheet(); render();
    };});
    return;
  }
  const u = State.user;
  openSheet(u ? 'Signed in' : 'Sign in',
    (u
      ? '<div class="dcard"><div class="dtitle">'+esc(u.displayName||u.email)+'</div>'+
        '<div style="color:var(--muted);font-size:14px">'+esc(u.email)+'</div>'+
        (isOperator(currentEmail())
          ? '<div style="margin-top:10px"><span class="pill p-available">Can log actions</span></div>'
          : '<div style="margin-top:10px"><span class="pill p-missing">View only</span>'+
            '<div style="font-size:13px;color:var(--muted);margin-top:7px">Your account is not on the operator list. Ask an admin to add '+esc(u.email)+' in Setup.</div></div>')+
        '</div>'+
        '<button class="btn full" id="signout">Sign out</button>'
      : '<div class="banner"><b>Use your work account</b>Sign in with your '+AUTH_DOMAIN_ALLOW+' Google account. Every action you log is recorded under that account, which is what makes the movement log trustworthy.</div>'+
        '<button class="btn pri full" id="signin">Sign in with Google</button>'),
  body=>{
    const si = body.querySelector('#signin');
    if(si) si.onclick = async ()=>{
      const prov = new fb.auth.GoogleAuthProvider();
      prov.setCustomParameters({hd: AUTH_DOMAIN_ALLOW});
      /* Popups fail on iOS and in home-screen apps, where session storage is
         partitioned. Fall back to a full-page redirect, which always works. */
      const needsRedirect = e => !e || !e.code ||
        ['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request',
         'auth/operation-not-supported-in-this-environment','auth/missing-initial-state',
         'auth/web-storage-unsupported','auth/internal-error'].indexOf(e.code) >= 0;
      try{
        await fb.auth.signInWithPopup(fb.authInst, prov);
        closeSheet();
      }catch(e){
        console.warn('popup sign-in failed', e);
        if(needsRedirect(e)){
          toast('Opening Google sign-in\u2026');
          try{ await fb.auth.signInWithRedirect(fb.authInst, prov); }
          catch(e2){ console.error(e2); toast('Sign-in failed \u2014 try a normal browser tab'); }
        } else {
          toast('Sign-in failed');
        }
      }
    };
    const so = body.querySelector('#signout');
    if(so) so.onclick = async ()=>{ await fb.auth.signOut(fb.authInst); closeSheet(); };
  });
}
document.getElementById('whoBtn').onclick = whoAmISheet;

(async ()=>{
  loadLocal();
  applyLabelRotation();
  mergeDefaultTeams(); applyPatches();
  await initFirebase();
  render();
  if(State.online){
    setTimeout(()=>{ if(!State.user) whoAmISheet(); }, 900);   /* prompt sign-in */
  } else if(!State.actor){
    setTimeout(whoAmISheet, 400);
  }
})();
</script>
